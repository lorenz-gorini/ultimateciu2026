name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC, best effort: weekends every 15 minutes; weekdays hourly.
    - cron: "7,22,37,52 * * * 0,6"
    - cron: "7 * * * 1-5"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  policy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      refresh: ${{ steps.decision.outputs.refresh }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide whether season refresh is due
        id: decision
        env:
          PAGES_EVENT: ${{ github.event_name }}
        run: python3 scripts/refresh_policy.py --event "$PAGES_EVENT" --github-output "$GITHUB_OUTPUT"

  build:
    needs: policy
    if: needs.policy.outputs.refresh == 'true'
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/verify.yml
    with:
      upload-pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
